# MetaTCR environment.
#
#   conda env create -f environment.yml
#   conda activate metatcr
#   pip install -e . --no-deps          # install MetaTCR itself
#
# Only the top-level packages are listed; conda resolves the low-level
# libraries (CUDA runtime, image/font/X11 stacks, etc.) automatically.
name: metatcr
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch
  - pytorch-cuda=12.1
  - numpy
  - pandas
  - scipy
  - pillow
  - matplotlib
  - seaborn
  - pip
  - pip:
      - annoy==1.17.3
      - biopython==1.87
      - certifi==2026.7.22
      - charset-normalizer==3.4.9
      - configargparse==1.7.5
      - cython==3.1.5
      - faiss-gpu-cu12==1.14.1.post1
      - fbpca==1.0
      - gdown==5.2.0
      - geosketch==1.3
      - harmonypy==2.0.0
      - idna==3.18
      - intervaltree==3.2.1
      - joblib==1.5.3
      - llvmlite==0.48.0
      - lmdb==2.3.0
      - numba==0.66.0
      # Pin so faiss-gpu-cu12 coexists with the conda-provided PyTorch CUDA stack.
      - nvidia-cublas-cu12==12.1.3.1
      - nvidia-cuda-nvrtc-cu12==12.9.86
      - nvidia-cuda-runtime-cu12==12.9.79
      - protobuf==7.35.1
      - pynndescent==0.6.0
      - pytz==2026.1.post1
      - requests==2.34.2
      - scanorama==1.7.4
      - scikit-learn==1.7.2
      - scipy==1.15.3
      - sortedcontainers==2.4.0
      # TCR2vec backbone; installed without its own deps in development.
      - tape-proteins==0.5
      - tensorboardx==2.6.5
      - threadpoolctl==3.6.0
      - tqdm==4.69.0
      - tzdata==2025.3
      - umap-learn==0.5.12
      - urllib3==2.7.0
